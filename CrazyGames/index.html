<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mr Games - Crazy Games</title>
    <style>
        /* Style for the button */
        .collapsible {
            background-color: #A1A1A1;
            color: white;
            cursor: pointer;
            padding: 10px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 16px;
        }

        /* Style for the collapsible content */
        .content {
            padding: 0 18px;
            display: none;  /* Initially hidden */
            overflow: hidden;
            background-color: #f1f1f1;
        }

        /* Optional: style for the collapsible content when expanded */
        .content.show {
            display: block;
        }
      
        .fixed-button {
              position: fixed; /* Fix the button on the screen */
              top: 20px; /* Distance from the top */
              left: 20px; /* Distance from the left */
              padding: 20px 40px; /* Increase the size of the button */
              font-size: 8px; /* Larger font */
              background-color: #4CAF50; /* Green background */
              color: white;
              border: none;
              border-radius: 13px;
              cursor: pointer;
              z-index: 1000; /* Ensure it's on top of other content */
          }
  
          /* Optional: Hover effect for the button */
          .fixed-button:hover {
              background-color: #45a049;
          }

          body {
            background-color: #A9A9A9
          }
    </style>
</head>
<body>
  <button class="fixed-button" onclick="window.location.href='https://celestialdodo.github.io/Mr-Games-Games-Played';">Back</button>

<!-- Button to toggle collapsible content -->
<button class="collapsible">Leek Factory</button>

<!-- The collapsible content -->
<div class="content">
    <p>This is some collapsible content. You can hide or show it using the button above.</p>
    <p>Feel free to add more content here!</p>
</div>

  <script>
        // Get the button and the collapsible content
        const collapsible = document.querySelector(".collapsible");
        const content = document.querySelector(".content");

        // Add click event listener to toggle content visibility
        collapsible.addEventListener("click", function() {
            // Toggle the 'show' class on the content to show/hide it
            content.classList.toggle("show");
            
            // Optionally, change button text based on state
            if (content.classList.contains("show")) {
                collapsible.textContent = "Close";
            } else {
                collapsible.textContent = "Leek Factory";
            }
        });
    </script>
</body>
</html>
