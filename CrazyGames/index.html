<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mr Games - Crazy Games</title>
    <style>
        /* Style for the button */
        .collapsible {
            background-color: #A1A1A1;
            color: white;
            cursor: pointer;
            padding: 10px;
            width: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
        }

        /* Style for the collapsible content */
        .content {
            padding: 0 18px;
            display: none;  /* Initially hidden */
            overflow: hidden;
            background-color: #f1f1f1;
        }

        /* Optional: style for the collapsible content when expanded */
        .content.show {
            display: block;
        }
      
        .fixed-button {
              position: fixed; /* Fix the button on the screen */
              top: 20px; /* Distance from the top */
              left: 20px; /* Distance from the left */
              padding: 20px 40px; /* Increase the size of the button */
              font-size: 15px; /* Larger font */
              background-color: #4CAF50; /* Green background */
              color: white;
              border: none;
              border-radius: 13px;
              cursor: pointer;
              min-width: 100px; /* Prevent it from becoming too small */
              max-width: 300px; /* Prevent it from becoming too large */
              z-index: 1000; /* Ensure it's on top of other content */
          }
  
          /* Optional: Hover effect for the button */
          .fixed-button:hover {
              background-color: #45a049;
          }

          body {
            background-color: #333333
          }
    </style>
</head>
<body>
  <iframe id="game-iframe" src="https://leek-factory-tycoon.game-files.crazygames.com/leek-factory-tycoon/7/index.html" allow=" accelerometer; gyroscope; autoplay; payment; fullscreen; microphone; clipboard-read; clipboard-write 'self' https://leek-factory-tycoon.game-files.crazygames.com/leek-factory-tycoon/7/index.html" webkitallowfullscreen="true" mozallowfullscreen="true" msallowfullscreen="true" allowfullscreen="true" sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-scripts allow-same-origin allow-downloads allow-popups-to-escape-sandbox" style="border: 0px; background-color: rgb(255, 255, 255); width: 10px; height: 10px; min-width: 100%; min-height: 100%;"></iframe>
  
  <button class="fixed-button" onclick="window.location.href='https://celestialdodo.github.io/Mr-Games-Games-Played';">Back</button>

<!-- Button to toggle collapsible content -->
<button class="collapsible" style="margin-top: 100px">Leek Factory</button>
<div class="content" id="Leek Factory">
    <iframe src="https://www.crazygames.com/embed/leek-factory-tycoon" style="width: 100% height: 100%" frameborder="0" allow="gamepad *;"></iframe>
</div>

  <script>
        // Get the button and the collapsible content
        const collapsableButtons = document.querySelectorAll('.collapsible');

        collapsableButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Get the text of the clicked button
                const sectionId = this.textContent.trim(); // Use .textContent to get button's text
                
                // Find the corresponding collapsible menu by the text of the button (matching ID)
                const collapsibleMenu = document.getElementById(sectionId);
                
                // Toggle the visibility of the collapsible menu
                if (collapsibleMenu) {
                    // If it's currently shown, hide it; otherwise, show it
                    if (collapsibleMenu.style.display === "block") {
                        collapsibleMenu.style.display = "none";
                    } else {
                        collapsibleMenu.style.display = "block";
                    }
                }
            });
        });
    </script>
</body>
</html>
